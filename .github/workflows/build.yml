name: Build PTZ Control Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python pillow pyinstaller comtypes pygrabber

      - name: Compilar com PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --clean `
            --collect-all comtypes `
            --collect-all pygrabber `
            ptz_control.py

      - name: Disponibilizar o Executável (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: PTZ-Control-Windows
          path: dist/ptz_control.exe
          retention-days: 7
